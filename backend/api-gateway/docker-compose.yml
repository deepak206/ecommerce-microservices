  api-gateway:
    build:
      context: ./backend/api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      user-service:
        condition: service_started